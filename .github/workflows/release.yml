# Changesets release flow. With pending changesets on main it opens (or refreshes) a
# "Version Packages" PR; merging that PR runs `bun run release`, which builds (tsdown +
# publint + attw) and publishes with provenance.
#
# Auth: npm trusted publishing (OIDC) — configure this repo + workflow file as the trusted
# publisher on npmjs.com under the package's settings. No NPM_TOKEN secret needed once set;
# the first-ever publish has to happen from a logged-in machine so the package exists.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
