name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ci:format
      - run: bun run ci:lint
      - run: bun run ci:typecheck
      - run: bun run ci:test
      - run: bun run build
      - run: bun run pack:check
      - name: Examples (own installs, since the root is the package and not a workspace root)
        run: |
          for dir in examples/*/; do
            (cd "$dir" && bun install --frozen-lockfile && bun run typecheck && bun run build)
          done
